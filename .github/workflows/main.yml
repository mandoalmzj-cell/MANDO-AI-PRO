name: MANDO AI PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: Android project files are missing."
            echo "The project must contain gradlew and the app folder."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANDO-AI-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
