name: MANDO AI PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*android*source*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            exit 1
          fi
          mkdir -p /tmp/mando-project
          unzip -o "$ZIP_FILE" -d /tmp/mando-project
          PROJECT_DIR=$(find /tmp/mando-project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          echo "Project files extracted."
          ls -la
          test -d app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANDO-AI-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
